name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Fix: suppress Node.js 20 deprecation warnings

jobs:

  # ── Stage 1: Secret Scanning ───────────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run secret scanner
        run: python scripts/secret_scanner.py

  # ── Stage 2: Unit Tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # ── Stage 3: Container Build & Trivy Scan ─────────────────────────────────
  container-security:
    name: Container Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-demo:${{ github.sha }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.31.0   # Fix: pin to stable version instead of @master
        with:
          image-ref: devsecops-demo:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

  # ── Stage 4: DAST with OWASP ZAP ──────────────────────────────────────────
  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Start application
        run: |
          pip install -r app/requirements.txt
          nohup python app/app.py &
          sleep 5
          curl -f http://localhost:5000/health

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0   # Fix: upgrade to v0.14.0 — resolves invalid artifact name (zap_scan) bug
        with:
          target: 'http://localhost:5000'
          fail_action: false
          artifact_name: zap-report   # Fix: keep hyphenated name; older versions ignored this and hardcoded "zap_scan"
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'   # Fix: pin to stable image to avoid pulling deprecated tags

      # Upload-artifact step is now redundant — action-baseline@v0.14.0 uploads
      # the report itself via artifact_name above. Keeping for the HTML report
      # copy that ZAP writes to the workspace root.
      - name: Upload ZAP HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report   # Fix: use hyphen, not underscore — artifact names must match [a-zA-Z0-9-]
          path: report_html.html
          if-no-files-found: warn     # Fix: don't hard-fail if ZAP didn't write the file

  # ── Stage 5: Deploy (only on main, all gates passed) ──────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [container-security, dast-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Simulate deployment
        run: |
          echo "✅ All security gates passed"
          echo "✅ Deploying devsecops-demo:${{ github.sha }}"
          echo "✅ Deployment complete"